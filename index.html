<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How an Art School Keeps a City Awake</title>
  <meta name="description" content="Shine a light across RISD's 15 West at night and look inside the windows that keep downtown Providence awake.">

  <!-- Degular Mono from Adobe Fonts (labels on data and statistics). Loaded
       without holding up the first screen: the page shows straight away and
       the font swaps in. -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/mja7rci.css"
        media="print" onload="this.media='all'">

  <!-- Shared (both people): colors, fonts, spacing -->
  <link rel="stylesheet" href="base.css">
  <!-- Owned by Person B -->
  <link rel="stylesheet" href="story.css">
  <!-- Owned by Person A -->
  <link rel="stylesheet" href="windows.css">
  <!-- Owner not assigned yet -->
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <main>
    <!-- Opening: "Where the Light Falls", the background to the story -->
    <section id="history" aria-label="Where the light falls"></section>

    <!-- Person A: the dark 15 West facade, flashlight and window stories -->
    <section id="windows" aria-label="15 West at night"></section>

    <!-- Person B: intro -->
    <header id="intro" class="story-section"></header>

    <!-- Person B: narrative text -->
    <section id="narrative" class="story-section"></section>

    <!-- Person B: legend -->
    <section id="legend" class="story-section"></section>
  </main>

  <!-- Person B: credits -->
  <footer id="credits" class="story-section"></footer>

  <!-- Sources for the opening section, at the very bottom (filled by history.js) -->
  <div id="sources"></div>

  <script src="history.js" defer></script>
  <script src="story.js" defer></script>
  <script src="windows.js" defer></script>
</body>
</html>
